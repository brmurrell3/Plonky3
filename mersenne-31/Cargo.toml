[package]
name = "p3-mersenne-31"
description = "An implementation of the Mersenne31 prime field F_p, where p = 2^31 - 1."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
p3-challenger.workspace = true
p3-dft.workspace = true
p3-field.workspace = true
p3-matrix.workspace = true
p3-mds.workspace = true
p3-poseidon2.workspace = true
p3-symmetric.workspace = true
p3-util.workspace = true

itertools.workspace = true
num-bigint.workspace = true
paste.workspace = true
rand.workspace = true
serde = { workspace = true, features = ["derive"] }

[features]
asic = ["dep:m31-accel-driver"]

[dependencies.m31-accel-driver]
path = "../../driver"
optional = true

[dev-dependencies]
p3-field-testing = { path = "../field-testing" }
p3-air = { path = "../air" }
p3-circle = { path = "../circle" }
p3-commit = { path = "../commit", features = ["test-utils"] }
p3-fri = { path = "../fri" }
p3-keccak = { path = "../keccak" }
p3-merkle-tree = { path = "../merkle-tree" }
p3-uni-stark = { path = "../uni-stark" }
m31-accel-driver = { path = "../../driver" }

criterion.workspace = true
rand_xoshiro.workspace = true

[[bench]]
name = "bench_field"
harness = false

[[bench]]
name = "extension"
harness = false

[lints]
workspace = true
